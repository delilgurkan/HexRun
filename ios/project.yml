# XcodeGen projesi: `xcodegen generate` → HexRun.xcodeproj (git'e girmez; CI üretir).
name: HexRun
options:
  bundleIdPrefix: co.hexrun
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: tr
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  HexRunKit:
    path: HexRunKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.8.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  HexRun:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HexRun
        excludes:
          - "Tests/**"
    dependencies:
      - package: HexRunKit
      - package: MapLibre
        product: MapLibre
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: HexRunWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.hexrun.app
        PRODUCT_NAME: HexRun
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    entitlements:
      path: HexRun/HexRun.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains: ["applinks:hexrun.co"]
    info:
      path: HexRun/Info.plist
      properties:
        CFBundleDisplayName: HexRun
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        UIBackgroundModes: [location, remote-notification, processing]
        BGTaskSchedulerPermittedIdentifiers: [co.hexrun.app.runqueue]
        NSLocationWhenInUseUsageDescription: "Koşu sırasında izini çizmek ve halkanın kapandığını anlamak için konumunu kullanırız. Haritada izin değil, yalnız kazandığın petekler görünür."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Koşu sırasında izini çizmek ve halkanın kapandığını anlamak için, ekran kapalıyken de (arka planda) konumunu kullanırız. Koşu dışında konum kaydedilmez."
        NSLocationAlwaysUsageDescription: "Koşu sırasında izini çizmek ve halkanın kapandığını anlamak için, ekran kapalıyken de konumunu kullanırız."
        UIAppFonts:
          - Archivo_400Regular.ttf
          - Archivo_500Medium.ttf
          - Archivo_600SemiBold.ttf
          - Archivo_700Bold.ttf
          - Archivo_800ExtraBold.ttf
          - Archivo_900Black.ttf
          - IBMPlexMono_400Regular.ttf
          - IBMPlexMono_500Medium.ttf
          - IBMPlexMono_600SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: co.hexrun.app
            CFBundleURLSchemes: [hexrun]
          - CFBundleURLName: google
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        GIDClientID: $(GOOGLE_CLIENT_ID)
        API_BASE_URL: $(API_BASE_URL)
        MAP_STYLE_URL: $(MAP_STYLE_URL)
        MAP_STYLE_URL_DARK: $(MAP_STYLE_URL_DARK)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  HexRunWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HexRunWatch
        excludes:
          - "Tests/**"
      - path: HexRun/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: HexRunKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.hexrun.app.watchkitapp
        PRODUCT_NAME: HexRun
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HexRun
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: co.hexrun.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)

  HexRunTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HexRun/Tests
    dependencies:
      - target: HexRun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.hexrun.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"

  HexRunUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HexRunUITests
    dependencies:
      - target: HexRun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.hexrun.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HexRun
        SWIFT_VERSION: "5.10"

  HexRunWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HexRunWatch/Tests
    dependencies:
      - target: HexRunWatch
      - package: HexRunKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.hexrun.app.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"

schemes:
  HexRun:
    build:
      targets:
        HexRun: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HexRunTests
        - HexRunUITests
    archive:
      config: Release
  HexRunWatch:
    build:
      targets:
        HexRunWatch: all
    archive:
      config: Release
  HexRunWatchTests:
    build:
      targets:
        HexRunWatchTests: [test]
    test:
      config: Debug
      targets:
        - HexRunWatchTests
