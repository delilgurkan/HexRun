name: Native
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vectors:
    name: Ortak test vektörleri güncel mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx packages/core/scripts/vectors.ts
      - run: git diff --exit-code shared/test-vectors

  swift-linux:
    name: HexRunKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/HexRunKit

  ios:
    name: iOS + watchOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodebuild -version && xcrun simctl list devices available | head -40
      - run: ./ci.sh
        working-directory: ios

  android:
    name: Android + Wear OS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./ci.sh
        working-directory: android
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
